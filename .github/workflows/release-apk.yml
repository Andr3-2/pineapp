name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.x
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "pine-${{ github.ref_name }}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_APK_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "pine-${{ github.ref_name }}.apk" \
            --title "${{ github.ref_name }}" \
            --generate-notes
